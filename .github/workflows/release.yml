# 推送 v* tag 或手动触发：三平台（Linux / Windows / Android）构建并发布到同一 Release
# 仅构建，不运行任何测试用例
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 取消同一 ref 上的旧运行，节省资源
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # 允许创建 Release / 上传产物

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 单平台失败不影响其他平台继续出包
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # Linux x64
            platform: linux
            bundles: deb,rpm,appimage
          - os: windows-latest # Windows x64
            platform: windows
            bundles: nsis
          - os: ubuntu-latest # Android arm64
            platform: android
            target: aarch64-linux-android
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.3.11579264
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      # 仅 Linux 桌面需要 Tauri v2 系统依赖；Windows 与 Android 构建环境开箱即用
      - name: Install system dependencies (Tauri v2 Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.platform }}

      - name: Install frontend deps
        run: bun install

      # ---------- Android 专属环境 ----------
      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache Android SDK
        if: matrix.platform == 'android'
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-ndk-26.3.11579264-platform36-bt35

      - name: Setup Android SDK & NDK
        if: matrix.platform == 'android' && steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"

      - name: Remove cargo config (let Tauri regenerate)
        if: matrix.platform == 'android'
        run: rm -f src-tauri/.cargo/config.toml

      - name: Create local.properties
        if: matrix.platform == 'android'
        run: echo "sdk.dir=$ANDROID_HOME" > src-tauri/gen/android/local.properties

      - name: Decode signing keystore from secrets
        if: matrix.platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > src-tauri/gen/android/app/keystore.jks
          cat > src-tauri/gen/android/app/keystore.properties << 'PROPS'
          tauri.android.storeFile=keystore.jks
          tauri.android.storeType=JKS
          tauri.android.storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          tauri.android.keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          tauri.android.keyPassword=${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
          PROPS

      # ---------- 构建 ----------
      # 桌面端：tauri-action 会执行 beforeBuildCommand（bun run build）生成前端产物
      - name: Build desktop bundles
        if: matrix.platform != 'android'
        uses: tauri-apps/tauri-action@v1
        with:
          manifest_path: src-tauri/Cargo.toml
          args: --bundles ${{ matrix.bundles }}

      # tauri android build 同样会执行 beforeBuildCommand
      - name: Build Android APK
        if: matrix.platform == 'android'
        run: bunx tauri android build --apk

      # 各平台只会命中自己的格式，未匹配的路径自动跳过
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Display downloaded artifacts
        run: find dist-artifacts -type f | head -30
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          overwrite_files: true
          fail_on_unmatched_files: false
          name: meme ${{ github.ref_name }}
          body: |
            ## 构建产物

            ### Linux x64
            - deb: Debian/Ubuntu 安装包
            - rpm: Fedora/RHEL 安装包
            - appimage: 通用 AppImage

            ### Windows x64
            - exe: Windows 安装程序

            ### Android arm64
            - apk: Android 安装包
